services:
  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    networks:
      - my_network
    ports:
      - "8080:8080"
    env_file: .env
    restart: unless-stopped

  client:
    build: ./client
    depends_on:
      - backend
    networks:
      - my_network
    env_file: .env
    restart: unless-stopped

  postgres:
    image: library/postgres:17.2-alpine
    container_name: dndmasters_pg
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      postgres -c max_connections=1000
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "5432:5432"
    networks:
      - my_network

networks:
  my_network:
    driver: bridge

volumes:
  pgdata: