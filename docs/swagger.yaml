basePath: /api/v1/dnd
definitions:
  authenticate_requests.AuthRequest:
    properties:
      user:
        $ref: '#/definitions/models.User'
    type: object
  authenticate_requests.AuthResponse:
    properties:
      token:
        type: string
    type: object
  authenticate_requests.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      hash:
        type: string
      password:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact:
    name: API Support
    url: https://t.me/dmastr
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://terragames.ru/
  title: Terra DND masters-service API
  version: "1.0"
paths:
  /register:
    post:
      description: Add new user and returns token for basic auth
      parameters:
      - description: User payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authenticate_requests.AuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authenticate_requests.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/authenticate_requests.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/authenticate_requests.ErrorResponse'
      summary: Add new user
      tags:
      - auth
  /token:
    get:
      description: Get token for current user
      parameters:
      - description: User payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authenticate_requests.AuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authenticate_requests.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/authenticate_requests.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/authenticate_requests.ErrorResponse'
      summary: get token
      tags:
      - auth
securityDefinitions:
  BasicAuth:
    type: basic
swagger: "2.0"
